[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sanctions-triage-copilot"
version = "0.2.0"
description = "Sanctions screening with LLM-assisted alert triage, deterministic guardrails, a tamper-evident audit trail and an eval suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "jellyfish>=1.0",
  "Unidecode>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "anthropic>=0.40",
  "Faker>=25",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
synth = ["sdv>=1.15", "pandas>=2.0"]
dev = ["pytest>=8", "pgserver>=0.1.4"]

[project.scripts]
stc = "sanctions_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sanctions_copilot = ["static/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
